server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ditangani proxy Coolify (Traefik/Caddy); container cukup HTTP.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Popup login Google mengirim id_token lewat window.postMessage; tanpa ini browser bisa memblokirnya.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Service worker, manifest, dan index.html harus selalu dicek ulang agar versi baru cepat terdeteksi
    # (notifikasi "Versi baru tersedia" di aplikasi bergantung pada ini).
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # File hasil build memakai hash di namanya; aman di-cache lama.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # File statis yang tidak ada dibalas 404, bukan index.html.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|pdf|woff2?|txt|map)$ {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rute SPA (/akademik, /absensi, ...) diarahkan ke index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        try_files $uri $uri/ /index.html;
    }
}
